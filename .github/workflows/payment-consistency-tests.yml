name: Payment consistency pure tests

on:
  push:
    branches:
      - staging/payment-review-hold-isolated
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated payment consistency tests
        run: node tests/payment-consistency.test.cjs
      - name: Check payment flow and hold safety invariants
        run: node tests/payment-flow-safety.test.cjs
      - name: Block shared CMS/VIP spreadsheet in staging
        run: node tests/staging-isolation.test.cjs
      - name: Test runtime spreadsheet safety guard
        run: node tests/staging-runtime-guard.test.cjs
      - name: Test actual partial-payment failure path
        run: node tests/payment-partial-failure.test.cjs
      - name: Test private read-only diagnostic entry point
        run: node tests/payment-diagnostic-entrypoint.test.cjs
      - name: Test admin-only Telegram diagnostic access
        run: node tests/payment-diagnostic-telegram-access.test.cjs
      - name: Test Telegram hold-review audit logging
        run: node tests/telegram-hold-review-audit.test.cjs
      - name: Test shared lock integration invariants
        run: node tests/telegram-hold-review-lock-integration.test.cjs
      - name: Test booking state without payment row
        run: node tests/payment-booking-without-row.test.cjs
