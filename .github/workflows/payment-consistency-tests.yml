name: Payment consistency pure tests

on:
  push:
    branches:
      - staging/payment-review-hold-isolated
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated payment consistency tests
        run: node --experimental-default-type=module tests/payment-consistency.test.cjs
